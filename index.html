const W=960,H=540,GY=455,WW=6400,S=1.5;
const COL=["#4ade80","#60a5fa","#f472b6","#facc15","#fb923c","#c084fc","#22d3ee","#f87171"];
const WN=["Beretta M9","MAC-10","AK-47","Benelli M3","Dragunov SVD"];
const cv=document.getElementById("c"),cx=cv.getContext("2d");cv.width=W;cv.height=H;

const IM={},KEYS=Object.keys(ASSETS);let loaded=0;
KEYS.forEach(k=>{const i=new Image();i.onload=i.onerror=()=>loaded++;i.src=ASSETS[k];IM[k]=i});
function fit(){const r=document.getElementById("w").getBoundingClientRect(),s=Math.min(r.width/W,r.height/H);cv.style.width=W*s+"px";cv.style.height=H*s+"px"}
addEventListener("resize",fit);fit();

// décor : immeubles et pluie (identiques sur tous les écrans)
const rnd=(()=>{let s=7;return()=>(s=(s*16807)%2147483647)/2147483647})();
const bl=[];for(let x=-100;x<WW*.5+W+200;){const w=60+rnd()*60,h=110+rnd()*160,wins=[];for(let j=0;j<14;j++)if(rnd()<.45)wins.push([rnd()*(w-12),rnd()*(h-16)]);bl.push({x,w,h,wins});x+=w+rnd()*20}
const rain=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,v:380+Math.random()*320}));

// état
const K={},TC={};let M=0,selWp=0,snap=null,pred=null,ws=null,myId=0,connected=false,lastIn="";
let pt=[],bnr="",bT=0,shake=0,flash=0,T=0,cam=WW/2-W/2,last=performance.now();
const disp=new Map();

let ac;function snd(f,d,ty,v,sl){try{ac=ac||new AudioContext();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=ty||"square";o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+d)}catch(e){}}
function tx(s,x,y,sz,c,al){cx.font="bold "+sz+"px monospace";cx.textAlign=al||"left";cx.lineWidth=4;cx.strokeStyle="#1a0f2b";cx.strokeText(s,x,y);cx.fillStyle=c||"#fff";cx.fillText(s,x,y)}
function unlocked(){return snap?Math.max(1,Math.min(5,snap.wave)):1}

// clavier / tactile / souris
addEventListener("keydown",e=>{K[e.code]=1;if(e.code==="Space"||e.code.startsWith("Arrow"))e.preventDefault();const d=+e.key;if(d>=1&&d<=5&&d<=unlocked())selWp=d-1;const u=unlocked();if(e.code==="KeyQ")selWp=(selWp+u-1)%u;if(e.code==="KeyE")selWp=(selWp+1)%u});
addEventListener("keyup",e=>{K[e.code]=0});
addEventListener("blur",()=>{for(const k in K)K[k]=0;for(const k in TC)TC[k]=0;M=0});
document.querySelectorAll("#ctl button").forEach(b=>{const k=b.dataset.k;
  b.addEventListener("pointerdown",e=>{e.preventDefault();TC[k]=1;b.classList.add("on")});
  ["pointerup","pointercancel","pointerleave"].forEach(n=>b.addEventListener(n,e=>{e.preventDefault();TC[k]=0;b.classList.remove("on")}))});
cv.addEventListener("pointerdown",e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  const u=unlocked();for(let i=0;i<u;i++){const sx=14+i*64;if(y>48&&y<82&&x>=sx&&x<sx+58){selWp=i;return}}
  if(e.pointerType==="mouse")M=1});
addEventListener("pointerup",()=>{M=0});

// réseau
function connect(){
  const url=(location.protocol==="http:"||location.protocol==="https:")?(location.protocol==="https:"?"wss://":"ws://")+location.host:"ws://localhost:3000";
  ws=new WebSocket(url);
  ws.onopen=()=>{connected=true;lastIn=""};
  ws.onclose=()=>{connected=false;snap=null;pred=null;setTimeout(connect,1500)};
  ws.onerror=()=>{};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
    if(m.t==="hello"){myId=m.id;return}
    if(m.t==="s"){snap=m;const mine=m.p.find(p=>p.id===myId);if(mine)reconcile(mine);else pred=null;for(const v of m.ev)onEv(v)}};
}
function sendIn(){
  if(!connected||ws.readyState!==1)return;
  const o={t:"in",l:+!!(K.KeyA||K.ArrowLeft||TC.l),r:+!!(K.KeyD||K.ArrowRight||TC.r),j:+!!(K.KeyW||K.ArrowUp||K.Space||TC.j),f:+!!(K.KeyJ||K.KeyF||K.KeyK||M||TC.f),w:Math.min(selWp,unlocked()-1)};
  const s=JSON.stringify(o);if(s!==lastIn){lastIn=s;ws.send(s)}
}

// prédiction locale du joueur + correction douce par le serveur
function reconcile(s){
  if(s.dead||!pred){pred={x:s.x,y:s.y,vy:s.vy,dir:s.dir};return}
  const dx=s.x-pred.x,dy=s.y-pred.y;
  if(Math.abs(dx)>150||Math.abs(dy)>150){pred.x=s.x;pred.y=s.y;pred.vy=s.vy}else{pred.x+=dx*.2;pred.y+=dy*.2}
  if(!s.mv)pred.dir=s.dir;
}
function predict(dt){
  const l=K.KeyA||K.ArrowLeft||TC.l,r=K.KeyD||K.ArrowRight||TC.r,j=K.KeyW||K.ArrowUp||K.Space||TC.j;
  const ax=(r?1:0)-(l?1:0);
  pred.x=Math.max(40,Math.min(WW-40,pred.x+ax*260*dt));if(ax)pred.dir=ax;
  if(j&&pred.y===0&&pred.vy<=0)pred.vy=820;
  pred.vy-=2300*dt;pred.y=Math.max(0,pred.y+pred.vy*dt);if(pred.y===0&&pred.vy<0)pred.vy=0;
}
function smooth(key,x,y,dt){let d=disp.get(key);if(!d||Math.abs(d.x-x)>400){d={x,y};disp.set(key,d)}else{const k=Math.min(1,dt*14);d.x+=(x-d.x)*k;d.y+=(y-d.y)*k}return d}

// événements serveur → effets
function blood(x,y,n,d){for(let i=0;i<n;i++)pt.push({x,y,vx:d*(40+Math.random()*160),vy:-Math.random()*220,l:.5+Math.random()*.4})}
function onEv(e){
  switch(e.ev){
    case"hurt":blood(e.x,e.y,6,-1);if(e.id===myId){shake=12;flash=.35}break;
    case"hit":blood(e.x,e.y,4,e.dir);break;
    case"kill":blood(e.x,e.y,10,e.dir);snd(110,.25,"sawtooth",.05,-60);break;
    case"shot":snd(e.f,.09,"sawtooth",.035,-e.f*.6);break;
    case"pick":snd(700,.15,"sine",.05,300);break;
    case"ann":bnr=e.s;bT=3;break;
  }
}

// animations : chaque feuille a des frames carrées (hauteur = largeur d'une frame)
function spr(k,fps,t,x,y,flip,loop,ax){
  const im=IM[k];if(!im||!im.width)return;
  const fw=im.height,n=Math.max(1,Math.round(im.width/fw));
  let fr=Math.floor(t*fps);fr=loop?((fr%n)+n)%n:Math.min(Math.max(fr,0),n-1);
  cx.save();cx.translate(x,y);if(flip)cx.scale(-1,1);
  cx.drawImage(im,fr*fw,0,fw,fw,-ax*S,-fw*S,fw*S,fw*S);cx.restore();
}

function update(dt){
  T+=dt;sendIn();
  const sp=snap?snap.p:[];const mine=sp.find(p=>p.id===myId);
  if(mine&&!mine.dead&&pred)predict(dt);
  let camT=WW/2;
  if(mine&&!mine.dead&&pred)camT=pred.x;
  else{const al=sp.filter(p=>!p.dead);if(al.length)camT=al.reduce((a,p)=>a+p.x,0)/al.length}
  cam+=(camT-W/2-cam)*Math.min(1,dt*6);cam=Math.max(0,Math.min(WW-W,cam));
  shake*=.85;flash=Math.max(0,flash-dt);bT-=dt;
  for(const q of pt){q.l-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=900*dt}
  pt=pt.filter(q=>q.l>0);
  for(const r of rain){r.y+=r.v*dt;if(r.y>H){r.y=-10;r.x=Math.random()*W}}
}

function draw(dt){
  cx.imageSmoothingEnabled=false;
  cx.fillStyle="#0d0818";cx.fillRect(0,0,W,H);
  if(loaded<KEYS.length){tx("Chargement…",W/2,H/2,26,"#fff","center");return}

  cx.save();
  cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const so=cam*.08,b0=Math.floor(so/W);
  for(let k=b0;k<=b0+1;k++){cx.save();cx.translate(k*W-so+(k%2?W:0),0);if(k%2)cx.scale(-1,1);cx.drawImage(IM.sky,0,0,W,H);cx.restore()}
  cx.fillStyle="rgba(20,10,40,.55)";const bo=cam*.5;
  for(const b of bl){const sx=b.x-bo;if(sx>W||sx+b.w<0)continue;cx.fillRect(sx,GY-b.h,b.w,b.h);cx.fillStyle="#f5c36a";for(const w of b.wins)cx.fillRect(sx+6+w[0],GY-b.h+8+w[1],5,7);cx.fillStyle="rgba(20,10,40,.55)"}
  cx.fillStyle="#241a33";cx.fillRect(0,GY,W,H-GY);
  cx.fillStyle="#5b4780";cx.fillRect(0,GY,W,4);
  cx.fillStyle="#3a2d4d";for(let x=-(cam%120);x<W;x+=120)cx.fillRect(x,GY+40,60,5);

  if(snap){
    const sp=snap.p,mine=sp.find(p=>p.id===myId);
    for(const i of snap.i){const x=i.x-cam,y=GY-18+Math.sin(T*5+i.id)*4;
      cx.fillStyle="#fff";cx.fillRect(x-9,y-9,18,18);cx.fillStyle="#e23b4e";cx.fillRect(x-7,y-2,14,4);cx.fillRect(x-2,y-7,4,14)}

    for(const z of snap.z){
      const d=smooth("z"+z.id,z.x,GY,dt);
      const pre=z.type==="wild"?"wz":z.type==="woman"?"zf":"zm";
      const anim=z.dead?"dead":z.st==="a"?"atk":"walk";
      const fps=anim==="dead"?8:anim==="atk"?10:(z.type==="wild"?14:8);
      const t=z.dead?z.dead:anim==="atk"?z.at:T+z.id*.37;
      cx.globalAlpha=z.dead>3?Math.max(0,4-z.dead):1;
      if(z.hit>0)cx.filter="brightness(2.5)";
      spr(pre+"_"+anim,fps,t,d.x-cam,d.y,z.dir<0,anim!=="dead"&&anim!=="atk",48);
      cx.filter="none";cx.globalAlpha=1;
    }

    for(const p of sp){
      const me=p.id===myId,usePred=me&&pred&&!p.dead;
      const q=usePred?pred:smooth("p"+p.id,p.x,p.y,dt);
      const dir=usePred?pred.dir:p.dir,skin=(p.id-1)%3;
      const a=p.dead?"dead":q.y>2?"jump":p.shot>0?"shot":p.mv?"run":"idle";
      const t=p.dead?p.dead:a==="jump"?p.air:T+p.id*.21;
      const fps={idle:8,run:14,shot:20,jump:10,dead:8}[a];
      cx.globalAlpha=p.dead?.4:(p.inv>0&&Math.floor(T*20)%2)?.45:1;
      spr("g"+skin+"_"+a,fps,t,q.x-cam,GY-q.y,dir<0,a!=="dead"&&a!=="jump",50);
      cx.globalAlpha=1;
      if(!p.dead)tx(p.name+(me?" (toi)":""),q.x-cam,GY-q.y-205,14,COL[(p.id-1)%COL.length],"center");
    }

    cx.strokeStyle="#ffe27a";
    for(const b of snap.b){cx.lineWidth=b.th;cx.beginPath();cx.moveTo(b.x-cam-b.s*22,b.y);cx.lineTo(b.x-cam,b.y);cx.stroke()}
    cx.fillStyle="#b3162b";for(const q of pt)cx.fillRect(q.x-cam,q.y,3,3);
  }
  cx.restore();

  // pluie et vignette
  cx.strokeStyle="rgba(170,190,255,.22)";cx.lineWidth=1;cx.beginPath();
  for(const r of rain){cx.moveTo(r.x,r.y);cx.lineTo(r.x-3,r.y+10)}cx.stroke();
  const g=cx.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,W*.7);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(5,0,15,.7)");cx.fillStyle=g;cx.fillRect(0,0,W,H);
  if(flash>0){cx.fillStyle="rgba(239,68,68,"+(flash*.7)+")";cx.fillRect(0,0,W,H)}
  if(disp.size>500)disp.clear();

  if(!connected||!snap){
    cx.fillStyle="rgba(13,8,24,.6)";cx.fillRect(0,0,W,H);
    tx("Connexion au serveur…",W/2,H/2-10,24,"#fff","center");
    tx("Lance « npm start » puis ouvre http://localhost:3000",W/2,H/2+26,16,"#ddd","center");
    return;
  }
  hud(snap.p,snap.p.find(p=>p.id===myId));
}

function hud(sp,mine){
  const u=unlocked(),sel=Math.min(selWp,u-1);
  if(mine){
    cx.fillStyle="#000a";cx.fillRect(14,14,200,22);cx.fillStyle=mine.hp>30?"#4ade80":"#ef4444";cx.fillRect(16,16,196*mine.hp/100,18);
    tx(mine.hp+" PV",20,31,15,"#fff");
  }
  tx("VAGUE "+snap.wave,W/2,34,24,"#fff","center");
  tx("Zombies restants : "+(snap.left+snap.alive),W/2,58,15,"#ddd","center");
  tx("Équipe : "+sp.reduce((a,p)=>a+p.score,0),W-16,30,18,"#ffd35a","right");
  [...sp].sort((a,b)=>b.score-a.score).slice(0,4).forEach((p,i)=>
    tx(p.name+"  "+p.score+(p.dead?" (KO)":""),W-16,52+i*18,14,COL[(p.id-1)%COL.length],"right"));
  for(let i=0;i<5;i++){
    const x=14+i*64,y=48;
    cx.fillStyle=i===sel?"#6b4fa0":"#000a";cx.fillRect(x,y,58,34);
    cx.strokeStyle=i===sel?"#ffd35a":"#555";cx.lineWidth=2;cx.strokeRect(x,y,58,34);
    if(i<u){const im=IM["w"+i],s=Math.min(2.4,50/im.width,26/im.height);cx.drawImage(im,x+29-im.width*s/2,y+17-im.height*s/2,im.width*s,im.height*s)}
    else tx("V"+(i+1),x+29,y+23,14,"#888","center");
  }
  tx("Joueur "+myId+" · "+WN[sel],14,104,14,"#ddd");
  if(bT>0){cx.globalAlpha=Math.min(1,bT);tx(bnr,W/2,130,26,"#ffd35a","center");cx.globalAlpha=1}
  if(mine&&mine.dead){
    cx.fillStyle="rgba(13,8,24,.45)";cx.fillRect(0,0,W,H);
    tx("À TERRE",W/2,H*.42,48,"#ef4444","center");
    tx("Réapparition avec tes coéquipiers…",W/2,H*.42+36,18,"#fff","center");
  }
  if(snap.ph==="over"){
    cx.fillStyle="rgba(13,8,24,.7)";cx.fillRect(0,0,W,H);
    tx("PARTIE TERMINÉE",W/2,200,56,"#ef4444","center");
    tx("Nouvelle manche dans "+Math.ceil(snap.ot)+" s",W/2,250,24,"#fff","center");
    tx("Meilleur score d'équipe : "+snap.best,W/2,290,20,"#ffd35a","center");
  }
}

function loop(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;update(dt);draw(dt);requestAnimationFrame(loop)}
connect();requestAnimationFrame(loop);
</script></body></html>
